version: '3.8'

services:
  eduvora-api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: eduvora-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=super-secret-enterprise-key-eduvora
    volumes:
      - ../..:/app
      - /app/node_modules
    restart: unless-stopped

  eduvora-nginx:
    image: nginx:alpine
    container_name: eduvora-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - eduvora-api
    restart: unless-stopped
